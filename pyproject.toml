[project]
name = "dailydrop"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0.0",
    "werkzeug==3.1.3",
    "jinja2==3.1.6",
    "markupsafe==3.0.2",
    "click==8.2.1",
    "itsdangerous==2.2.0",
    "python-dotenv==1.0.0",
    "gunicorn==21.2.0",
    "flask-cors==4.0.0",
    "flask-wtf==1.2.1",
    "flask-limiter==3.5.0",
    "psycopg2-binary>=2.9.9",
    "requests>=2.28.0",
    "razorpay>=1.4.1",
    "redis>=5.0.0",
    "rq>=1.15.0",
    "pillow>=10.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["venv", ".venv", "dailydrop16", "analytics/notebooks"]

[tool.ruff.lint]
select = ["E9", "F401", "F63", "F7", "F811", "F821", "F841"]

[tool.black]
line-length = 120
target-version = ["py311"]
extend-exclude = '''
/(venv|\.venv|dailydrop16)/
'''
