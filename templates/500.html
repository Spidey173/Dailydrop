<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DailyDrop | 500 - Server Error</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo1.webp') }}">

  <!-- Bootstrap, FontAwesome & Google Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- Centralized Stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">

  <style>
    body {
      background-color: var(--bg-base);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .error-container {
      max-width: 650px;
      margin: 120px auto 60px;
      padding: 0 20px;
      text-align: center;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .error-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-glass);
      padding: 50px 40px;
      box-shadow: var(--shadow-lg);
      width: 100%;
    }
    .error-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #ef4444;
      font-size: 0.85rem;
      font-weight: 700;
      padding: 4px 14px;
      border-radius: 9999px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 24px;
    }
    .error-code {
      font-size: 5.5rem;
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #f59e0b 0%, #ef4444 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .error-title {
      font-size: 1.75rem;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 16px;
    }
    .error-desc {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 32px;
    }
    .btn-return-home {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #fff;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: var(--radius-sm);
      text-decoration: none;
      transition: var(--transition-normal);
      border: none;
    }
    .btn-return-home:hover {
      background: var(--accent-hover);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(16, 185, 129, 0.25);
    }
  </style>
</head>
<body>

  <!-- Sticky Floating Navbar -->
  <nav class="navbar">
    <div class="container navbar-container">
      <a href="{{ url_for('main.index') }}" class="logo">
        <i class="fas fa-shopping-basket"></i> Daily<span>Drop</span>
      </a>
      <div class="nav-actions">
        <a href="{{ url_for('main.index') }}" class="login-btn-outline"><i class="fas fa-home"></i> Home</a>
      </div>
    </div>
  </nav>

  <div class="error-container">
    <div class="error-card">
      <div class="error-badge">
        <i class="fas fa-server"></i> Error 500
      </div>
      <div class="error-code">500</div>
      <h1 class="error-title">Internal Server Error</h1>
      <p class="error-desc">
        We encountered an unexpected server issue while processing your request. Please try refreshing or return to the storefront.
      </p>
      <div>
        <a href="{{ url_for('main.index') }}" class="btn-return-home">
          <i class="fas fa-arrow-left"></i> Return to Storefront
        </a>
      </div>
    </div>
  </div>

</body>
</html>
