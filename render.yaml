# DailyDrop Render Infrastructure as Code Blueprint
# Defines persistent production web service, RQ background worker, and managed Redis/Postgres.

services:
  # DailyDrop Web WSGI Application
  - type: web
    name: dailydrop-web
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dailydrop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dailydrop-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DEMO_PAYMENTS
        value: "false"

  # DailyDrop Asynchronous Background Task Worker
  # Note: A dedicated persistent worker service is REQUIRED. Serverless hosting platforms
  # (such as Vercel) freeze execution between inbound HTTP requests, terminate background threads,
  # and cannot maintain continuous long-lived Redis subscription streams or process asynchronous
  # RQ job queues reliably.
  - type: worker
    name: dailydrop-worker
    env: docker
    dockerfilePath: Dockerfile
    dockerCommand: python worker.py
    plan: starter
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dailydrop-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: dailydrop-redis
          property: connectionString
      - key: REDIS_ENABLED
        value: "true"

  # Redis Instance for In-Memory Caching and Distributed Queue
  - type: redis
    name: dailydrop-redis
    plan: starter
    ipAllowList: []

databases:
  # PostgreSQL Database Instance
  - name: dailydrop-postgres
    plan: starter
    databaseName: dailydrop
    user: dailydrop
